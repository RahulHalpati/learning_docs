<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaming AI Chat</title>
  <style>
    :root { --bg:#0f1117; --panel:#171a23; --user:#2563eb; --bot:#272b38; --text:#e7e9ee; --muted:#8b90a0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 18px; background:var(--panel); font-weight:600; border-bottom:1px solid #00000033; }
    header small { font-weight:400; color:var(--muted); margin-left:8px; }
    #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:75%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
    .bot  { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .bot.streaming::after { content:"▋"; color:var(--muted); animation:blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    footer { display:flex; gap:8px; padding:12px; background:var(--panel); border-top:1px solid #00000033; }
    #input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid #333; background:#0d0f15; color:var(--text); font-size:15px; }
    button { padding:0 18px; border:0; border-radius:10px; font-size:15px; cursor:pointer; color:#fff; }
    #send { background:var(--user); }
    #stop { background:#b91c1c; display:none; }
    button:disabled { opacity:.5; cursor:default; }
    #status { padding:4px 18px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <header>Streaming AI Chat <small>FastAPI · WebSockets · async</small></header>
  <div id="log"></div>
  <div id="status">connecting…</div>
  <footer>
    <input id="input" placeholder="Ask something… (Enter to send)" autocomplete="off" />
    <button id="send">Send</button>
    <button id="stop">Stop</button>
  </footer>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");
    const status = document.getElementById("status");

    // Build the WebSocket URL from the current page so it works on any host/port.
    // (Page served over http -> ws://; over https -> wss://.)
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${wsProto}//${location.host}/ws/chat`);

    let currentBot = null;        // the assistant bubble currently being filled
    let streaming = false;

    ws.onopen  = () => { status.textContent = "connected"; };
    ws.onclose = () => { status.textContent = "disconnected"; setStreaming(false); };
    ws.onerror = () => { status.textContent = "connection error"; };

    // Each server message is one JSON object with a "type".
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "token") {
        if (!currentBot) currentBot = addBubble("bot streaming");
        currentBot.textContent += msg.content;       // append the token
        log.scrollTop = log.scrollHeight;
      } else if (msg.type === "end") {
        if (currentBot) currentBot.classList.remove("streaming");
        currentBot = null;
        setStreaming(false);
        status.textContent = msg.stopped ? "stopped" : "connected";
      } else if (msg.type === "error") {
        addBubble("bot").textContent = "⚠️ " + msg.detail;
        currentBot = null;
        setStreaming(false);
      }
    };

    function addBubble(cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function setStreaming(on) {
      streaming = on;
      stopBtn.style.display = on ? "block" : "none";
      sendBtn.disabled = on;
      input.disabled = on;
      if (!on) input.focus();
    }

    function send() {
      const text = input.value.trim();
      if (!text || streaming || ws.readyState !== WebSocket.OPEN) return;
      addBubble("user").textContent = text;          // show the user's message
      ws.send(text);                                 // send the prompt
      input.value = "";
      setStreaming(true);
      status.textContent = "thinking…";
    }

    sendBtn.onclick = send;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    stopBtn.onclick = () => { if (streaming) ws.send("__stop__"); };   // interrupt the reply
  </script>
</body>
</html>
