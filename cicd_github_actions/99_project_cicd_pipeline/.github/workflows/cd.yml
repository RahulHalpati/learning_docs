name: CD

# Continuous Delivery: build & push an image, deploy to staging automatically,
# then to production behind a manual approval. Runs only after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false        # never cancel a half-finished production deploy

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    # only deploy if CI actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to GitHub Container Registry
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging            # GitHub Environment (its own secrets/vars)
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: ./scripts/deploy.sh staging "${{ needs.build-and-push.outputs.image }}"
      - name: Smoke test staging
        run: ./scripts/smoke_test.sh "${{ vars.STAGING_URL }}"

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production         # add "Required reviewers" here → manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: ./scripts/deploy.sh production "${{ needs.build-and-push.outputs.image }}"
      - name: Smoke test production
        run: ./scripts/smoke_test.sh "${{ vars.PRODUCTION_URL }}"
