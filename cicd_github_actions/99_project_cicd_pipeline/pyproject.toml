[project]
name = "linkstash"
version = "1.2.0"
description = "A tiny link-shortener API used to demonstrate a full CI/CD pipeline."
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# a sensible starter rule set: pyflakes(F), pycodestyle(E/W), isort(I), bugbear(B), pyupgrade(UP)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
